name: Build Lumina Engine APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Manuel tetikleme sağlar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.5

    - name: Download OpenCV Android SDK
      run: |
        wget https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
        unzip opencv-4.9.0-android-sdk.zip -d opencv-sdk

    - name: Build with Gradle
      run: gradle assembleDebug --warning-mode all --stacktrace -PopencvDir=$GITHUB_WORKSPACE/opencv-sdk/OpenCV-android-sdk/sdk/native/jni

    - name: List build directory
      run: ls -R app/build/outputs/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lumina-engine-debug
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
